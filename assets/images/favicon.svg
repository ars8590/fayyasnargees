<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c5a059"/>
      <stop offset="25%" stop-color="#fcf5d8"/>
      <stop offset="50%" stop-color="#b08850"/>
      <stop offset="75%" stop-color="#fcf5d8"/>
      <stop offset="100%" stop-color="#8c6218"/>
    </linearGradient>

    <!-- Deep Luxury Burgundy Background Radial -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#36050b"/>
      <stop offset="100%" stop-color="#180201"/>
    </radialGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#c5a059" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular Outer Base -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8"/>

  <!-- Inner Delicate Filigree Ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="4 8" opacity="0.8"/>

  <!-- Elegant Islamic Moorish Arch Silhouette -->
  <path d="M 180 340 L 180 230 C 180 180, 256 140, 256 140 C 256 140, 332 180, 332 230 L 332 340 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="4" filter="url(#goldGlow)"/>

  <!-- Center Diamond & Crest -->
  <polygon points="256,120 266,135 256,150 246,135" fill="url(#goldGrad)"/>

  <!-- Monogram F & N -->
  <text x="256" y="275" 
        font-family="'Cinzel', 'Cormorant Garamond', 'Times New Roman', serif" 
        font-size="82" 
        font-weight="600" 
        letter-spacing="2" 
        fill="url(#goldGrad)" 
        text-anchor="middle" 
        filter="url(#goldGlow)">F&amp;N</text>

  <!-- Small Diamond Ornament Below -->
  <polygon points="256,305 261,313 256,321 251,313" fill="url(#goldGrad)"/>
</svg>
